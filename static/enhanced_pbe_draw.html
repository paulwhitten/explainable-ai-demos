<html>
<head>
    <style>
        .transform-section {
            margin: 10px 0;
        }
        
        .transform-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .transform-cell {
            position: relative;
            cursor: pointer;
            padding: 5px;
            text-align: center;

        }
        
        .transform-cell:hover {

        }

            position: absolute;

            right: -5px;

            border-radius: 10px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
        }
        
        .tooltip {
            position: absolute;
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            max-width: 200px;
            z-index: 1000;
            pointer-events: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);

            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 60%;
            border-radius: 8px;
            max-height: 70vh;
            overflow-y: auto;

            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

            color: black;
        }

            margin: 5px 0;
            border-radius: 5px;

        }

        }

            color: #0066cc;
            cursor: pointer;
            text-decoration: underline;
        }
        
        .contribution-value {
            font-weight: bold;
            color: #28a745;
        }

</head>

// Tooltip functions
function showQuickTooltip(element, transformName) {
    const tooltip = document.getElementById('quick-tooltip');
    const transform = TRANSFORM_EXPLANATIONS[transformName];
    
    if (transform) {
        tooltip.innerHTML = `<strong>${transform.name}</strong><br>${transform.shortDesc}<br><small>Effectiveness: ${transform.effectiveness}<br>Interpretability: ${transform.explainability}</small>`;
        tooltip.style.display = 'block';
        
        // Position tooltip near the element
        const rect = element.getBoundingClientRect();
        tooltip.style.left = (rect.left + rect.width / 2 - 100) + 'px';
        tooltip.style.top = (rect.top - 80) + 'px';
    }
}

function hideQuickTooltip() {
    document.getElementById('quick-tooltip').style.display = 'none';
}

function showDetailedExplanation(transformName) {
    const modal = document.getElementById('detailed-modal');
    const modalBody = document.getElementById('modal-body');
    const transform = TRANSFORM_EXPLANATIONS[transformName];
    
    if (transform) {
        const explainabilityColor = transform.explainability.includes('High') ? '#e8f5e8' : '#fff3cd';
        const explainabilityIcon = transform.explainability.includes('High') ? '✓' : '⚠️';
        
        modalBody.innerHTML = `
            <h2 style="color: ${transform.color};">${transform.name}</h2>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0;">
                <strong>Quick Summary:</strong> ${transform.shortDesc}
            </div>
            <h3>Detailed Explanation</h3>
            <p>${transform.longDesc}</p>
            
            <h3>Performance</h3>
            <div style="background: #e8f5e8; padding: 10px; border-radius: 5px;">
                <strong>Effectiveness:</strong> ${transform.effectiveness}
            </div>
            
            <h3>Explainability</h3>
            <div style="background: ${explainabilityColor}; padding: 10px; border-radius: 5px;">
                <strong>${explainabilityIcon} ${transform.explainability}</strong><br>
                <small>${transform.explainabilityDesc}</small>
            </div>
            
            <h3>Best For</h3>
            <ul>
                ${transform.goodFor.map(item => `<li>${item}</li>`).join('')}
            </ul>
            
            <h3>Example</h3>
            <div style="background: #fff3cd; padding: 10px; border-radius: 5px; border-left: 4px solid #ffc107;">
                ${transform.example}
            </div>
        `;
        modal.style.display = 'block';
    }
}

function closeDetailedModal() {
    document.getElementById('detailed-modal').style.display = 'none';
}

async function loadEffectivenessMetrics(buildName = '002') {
    try {
        const response = await fetch(`/api/effectiveness/${buildName}`);
        if (response.ok) {
            const metrics = await response.json();
            
            // Update each transform's effectiveness badge
            Object.keys(metrics).forEach(transform => {
                const badge = document.querySelector(`[data-transform="${transform}"] .effectiveness-badge`);
                if (badge) {
                    badge.textContent = metrics[transform];
                }
            });
            
            console.log('Effectiveness metrics loaded:', metrics);
        } else {
            console.warn('Could not load effectiveness metrics, using defaults');
            // Fallback to defaults if API fails
            setDefaultEffectivenessValues();
        }
    } catch (error) {
        console.error('Error loading effectiveness metrics:', error);
        setDefaultEffectivenessValues();
    }
}

// Fallback function to set default AUC (overall effectiveness) values
function setDefaultEffectivenessValues() {
    const defaults = {
        'skel': '99.9%', 'ellipse': '81.2%', 'circle': '86.7%', 'ellipse-circle': '87.3%',
        'corner': '64.8%', 'endpoint': '83.1%', 'crossing': '41.5%', 'line': '64.2%',
        'chull': '84.6%', 'fill': '47.3%', 'raw': '98.2%'
    };
    
    Object.keys(defaults).forEach(transform => {
        const badge = document.querySelector(`[data-transform="${transform}"] .effectiveness-badge`);
        if (badge) {
            badge.textContent = defaults[transform];
        }
    });
}

function toggleEffectiveness() {
    const badges = document.querySelectorAll('.effectiveness-badge');
    const isVisible = badges[0].style.display !== 'none';
    
    badges.forEach(badge => {
        badge.style.display = isVisible ? 'none' : 'block';
    });
    
    const btn = document.getElementById('show-effectiveness-btn');
    btn.textContent = isVisible ? '📊 Show Performance' : '📊 Hide Performance';
}

    modalBody.innerHTML = `

// Your existing variables and functions
var canvas, ctx, flag = false,
    prevX = 0,
    currX = 0,
    prevY = 0,
    currY = 0,
    dot_flag = false;

var x = "white",
    y = 16;

function init() {
    // Your existing init code...
    canvas = document.getElementById('can');
    ctx = canvas.getContext("2d");
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    w = canvas.width;
    h = canvas.height;

    // Your existing event listeners...
    canvas.style.touchAction = 'none';
    canvas.addEventListener('pointerdown', function (e) {
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
        e.preventDefault();
        findxy('down', e);
    }, false);

    canvas.addEventListener('pointermove', function (e) {
        findxy('move', e);
    }, false);

    canvas.addEventListener('pointerup', function (e) {
        if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
        e.preventDefault();
        findxy('up', e);
    }, false);

    canvas.addEventListener('pointercancel', function (e) {
        if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
        findxy('out', e);
    }, false);

    ctx.lineWidth = y;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'white';
}

// Your existing drawing and submission functions...
function draw() {
    ctx.beginPath();
    ctx.moveTo(prevX, prevY);
    ctx.lineTo(currX, currY);
    ctx.strokeStyle = x;
    ctx.lineWidth = y;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.closePath();
}

function erase() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Clear all result labels
    for (let i = 0; i < 4; i++) {
        document.getElementById('label' + i).innerHTML = '';
    }

    // Clear all property images
    document.getElementById('skel').src = "";
    document.getElementById('chull').src = "";
    document.getElementById('endpoint').src = "";
    document.getElementById('corner').src = "";
    document.getElementById('crossing').src = "";
    document.getElementById('line').src = "";
    document.getElementById('circle').src = "";
    document.getElementById('ellipse-circle').src = "";
    document.getElementById('ellipse').src = "";
    document.getElementById('fill').src = "";
    document.getElementById('raw').src = "";
}

function findxy(res, e) {
    if (res == 'down') {
        prevX = currX;
        prevY = currY;
        currX = e.clientX - canvas.offsetLeft;
        currY = e.clientY - canvas.offsetTop;

        flag = true;
        dot_flag = true;
        if (dot_flag) {
            ctx.beginPath();
            ctx.fillStyle = x;
            ctx.fillRect(currX, currY, 2, 2);
            ctx.closePath();
            dot_flag = false;
        }
    }
    if (res == 'up' || res == "out") {
        flag = false;
    }
    if (res == 'move') {
        if (flag) {
            prevX = currX;
            prevY = currY;
            currX = e.clientX - canvas.offsetLeft;
            currY = e.clientY - canvas.offsetTop;
            draw();
        }
    }
}

function characterize_confidence(val) {
    if (val > 0.8) return "high";
    if (val > 0.5) return "medium";
    return "low";
}

function submit() {
    // Your existing submit code with enhanced result display...
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 28;
    tempCanvas.height = 28;
    const tempCtx = tempCanvas.getContext('2d');
    
    tempCtx.imageSmoothingEnabled = true;
    tempCtx.imageSmoothingQuality = 'high';
    tempCtx.drawImage(canvas, 0, 0, 280, 280, 0, 0, 28, 28);

    var imgData = tempCtx.getImageData(0, 0, 28, 28);
    let img = [];
    for (let i = 0; i < imgData.data.length; i += 4) {
        img.push(imgData.data[i]);
    }

    fetch('/submit_pbe', {
        method: 'POST',
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify(img)
    })
    .then(data => data.json())
    .then(d => {
        const tally = JSON.parse(d);
        displayEnhancedResults(tally);
    })
    .catch(error => {
        console.error("Error:", error);
    });
}

function displayEnhancedResults(tally) {
    // Enhanced result display with transform explanations
    let total = 0.0;
    for (let v of tally) {
        v.attributions.sort((a, b) => b.effectiveness - a.effectiveness);
        total += v.value;
        v["exp"] = v.explainability / v.value;
    }
    
    tally.sort((a, b) => b.value - a.value);
    
    let count = 0;
    for (let v of tally) {
        v.pred = v.value / total;
        
        let res = `<div class="result-explanation">`;
        res += `<h4>`;
        if (count === 0) {
            res += `🏆 Winner: Digit ${v.class}`;
        } else {
            res += `Alternative: Digit ${v.class}`;
        }
        res += ` (${(v.pred * 100).toFixed(1)}% confidence)</h4>`;
        
        // Add explainability information
        const explainabilityPercent = (v.exp * 100).toFixed(1);
        const explainabilityLevel = v.exp >= 0.75 ? 'high' : (v.exp >= 0.25 ? 'medium' : 'low');
        res += `<div class="explainability-info" style="margin-bottom: 10px; padding: 8px; background: ${explainabilityLevel === 'high' ? '#e8f5e8' : explainabilityLevel === 'medium' ? '#fff3cd' : '#ffe6e6'}; border-radius: 5px;">`;
        res += `<strong>Explainability:</strong> ${explainabilityPercent}% (${explainabilityLevel}) - This prediction is based on ${explainabilityLevel === 'high' ? 'highly interpretable' : explainabilityLevel === 'medium' ? 'moderately interpretable' : 'less interpretable'} evidence.`;
        res += `</div>`;
        
        res += `<div class="contributing-transforms">`;
        res += `<strong>Key Evidence:</strong><br>`;
        
        for (let a of v.attributions) {
            if (a.image) {
                const img = document.getElementById(a.name);
                if (img) {
                    img.src = 'data:image/png;base64,' + a.image;
                }
            }
            
            const transform = TRANSFORM_EXPLANATIONS[a.name];
            if (transform) {
                res += `<div class="transform-contribution">`;
                res += `<span class="transform-name" onclick="showDetailedExplanation('${a.name}')" style="color: ${transform.color};">`;
                res += `${transform.name}</span>: `;
                
                // Use the raw value if it's a valid number, otherwise show effectiveness
                let contributionText = '';
                if (typeof a.value === 'number' && !isNaN(a.value) && a.value > 0) {
                    contributionText = `<span class="contribution-value">${a.value.toFixed(3)}</span>`;
                } else if (typeof a.effectiveness === 'number' && !isNaN(a.effectiveness)) {
                    contributionText = `<span class="contribution-value">${(a.effectiveness * 100).toFixed(1)}% effective</span>`;
                } else {
                    contributionText = `<span class="contribution-value">contributing</span>`;
                }
                
                res += contributionText;
                
                // Show explainability score for each transform
                if (typeof a.exp === 'number') {
                    const expIcon = a.exp === 1.0 ? '✓' : a.exp === 0.0 ? '⚠️' : '~';
                    const expColor = a.exp === 1.0 ? '#28a745' : a.exp === 0.0 ? '#dc3545' : '#ffc107';
                    res += ` <span style="color: ${expColor};" title="Explainability: ${(a.exp * 100).toFixed(0)}%">${expIcon}</span>`;
                }
                
                res += ` - ${transform.shortDesc}`;
                res += `</div>`;
            }
        }
        
        res += `</div>`;
        
        // Add failure analysis if available
        if (v.failures && v.failures.trim() !== '') {
            res += `<div style="margin-top: 10px; padding: 10px; background: #fff3cd; border-left: 4px solid #ffc107; border-radius: 3px;">`;
            res += `<strong>Known Limitations:</strong>`;
            res += v.failures;
            res += `</div>`;
        }
        
        res += `</div>`;
        
        if (count < 4 && v.value > 0.0) {
            document.getElementById('label' + count).innerHTML = res;
        }
        count++;
    }
}

</script>
