    // from https://stackoverflow.com/questions/2368784/draw-on-html5-canvas-using-a-mouse
    // https://stackoverflow.com/questions/10673122/how-to-save-canvas-as-an-image-with-canvas-todataurl
    var canvas, ctx, flag = false,
        prevX = 0,
        currX = 0,
        prevY = 0,
        currY = 0,
        dot_flag = false;

    var x = "white",
        y = 16; // Increased line width for the larger canvas
    
    function init() {
        canvas = document.getElementById('can');
        ctx = canvas.getContext("2d");
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        w = canvas.width;
        h = canvas.height;
    
        // Unified input: use Pointer Events (works for mouse, touch and pen)
        // Prevent the browser from handling gestures (scroll/zoom) when interacting with the canvas
        canvas.style.touchAction = 'none';

        // Pointer down/move/up handlers call the same findxy() function
        canvas.addEventListener('pointerdown', function (e) {
            if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
            e.preventDefault();
            findxy('down', e);
        }, false);

        canvas.addEventListener('pointermove', function (e) {
            // don't call preventDefault here unless necessary; pointerdown already disabled touch-action
            findxy('move', e);
        }, false);

        canvas.addEventListener('pointerup', function (e) {
            if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
            e.preventDefault();
            findxy('up', e);
        }, false);

        canvas.addEventListener('pointercancel', function (e) {
            if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
            findxy('out', e);
        }, false);

        ctx.lineWidth = y;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'white';
    }

    function draw() {
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(currX, currY);
        ctx.strokeStyle = x;
        ctx.lineWidth = y;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.closePath();
    }
    
    function erase() {
        //var m = confirm("Want to clear");
        //ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "black";

        for (let i = 1; i <= 10; i++) {
            if ( i <= 4 ) {

    function characterize_confidence(conf) {
        if (conf >= 0.750) {
            return "high";
        } else if ( conf >= 0.250 ) {
            return "medium"
        } else {
            return "low"
        }
    }
    
    function submit() {
        // Create a temporary canvas for scaling

        tempCanvas.height = 28;

        let transNameToProp = {

            chull: "convex hull",

        };

        // scale and center the drawing to 28x28
        const imgData = to28x28Centered(canvas);
        //var dataURL = canvas.toDataURL();

        //console.log("image data:", imgData);

        let img = [];

			    "Accept": "application/json"

        .then(d => {

            document.getElementById("centered_img").src = 'data:image/png;base64,' + case_result.centered;
            for (let n of case_result.neighbors) {

                console.log("image:", elt_name, img);

                var p = document.getElementById(elt_name);

                neighbor_count++;

            document.getElementById("label1").innerHTML = "Prediction: " + case_result.prediction;
            let pct = (case_result.correspondence * 100).toFixed(1);
            document.getElementById("label2").innerHTML = "Correspondence: " + pct + "% (" + case_result.correspondence_interpretation + ")";
            document.getElementById("label3").innerHTML = "";
            document.getElementById("label4").innerHTML = "";
        })
        .catch(error => {
            console.error("Error:", error);
        });

    }
    
    function findxy(res, e) {
        const pos = getCanvasCoords(e);
        if (res == 'down') {
            prevX = currX;
            prevY = currY;
            currX = pos.x;
            currY = pos.y;
    
            flag = true;
            dot_flag = true;
            if (dot_flag) {
                ctx.beginPath();
                ctx.fillStyle = x;
                ctx.fillRect(currX, currY, 2, 2);
                ctx.closePath();
                dot_flag = false;
            }
        }
        if (res == 'up' || res == "out") {
            flag = false;
        }
        if (res == 'move') {
            if (flag) {
                prevX = currX;
                prevY = currY;
                currX = pos.x;
                currY = pos.y;
                draw();
            }
        }
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function to28x28Centered(srcCanvas, bgColor = [0,0,0,255]) {
        const sw = srcCanvas.width, sh = srcCanvas.height;
        const sctx = srcCanvas.getContext('2d');
        const sdata = sctx.getImageData(0, 0, sw, sh).data;

        let minX = sw, minY = sh, maxX = 0, maxY = 0, found = false;
        for (let y = 0; y < sh; y++) {
            for (let x = 0; x < sw; x++) {
                const idx = (y * sw + x) * 4;
                const r = sdata[idx], g = sdata[idx+1], b = sdata[idx+2], a = sdata[idx+3];
                if (!(r === bgColor[0] && g === bgColor[1] && b === bgColor[2] && a === bgColor[3])) {
                    found = true;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (!found) {
            const tmp = document.createElement('canvas');
            tmp.width = 28; tmp.height = 28;
            const tctx = tmp.getContext('2d');
            tctx.fillStyle = 'black';
            tctx.fillRect(0,0,28,28);
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = 'high';
            tctx.drawImage(srcCanvas, 0, 0, sw, sh, 0, 0, 28, 28);
            return tctx.getImageData(0,0,28,28);
        }

        const cw = maxX - minX + 1;
        const ch = maxY - minY + 1;
        const inner = 20;
        const scale = Math.min(inner / cw, inner / ch);
        const targetW = Math.max(1, Math.round(cw * scale));
        const targetH = Math.max(1, Math.round(ch * scale));

        const tmpScaled = document.createElement('canvas');
        tmpScaled.width = targetW; tmpScaled.height = targetH;
        const sctx2 = tmpScaled.getContext('2d');
        sctx2.imageSmoothingEnabled = true;
        sctx2.imageSmoothingQuality = 'high';
        sctx2.drawImage(srcCanvas, minX, minY, cw, ch, 0, 0, targetW, targetH);

        const dst = document.createElement('canvas');
        dst.width = 28; dst.height = 28;
        const dctx = dst.getContext('2d');
        dctx.fillStyle = 'black';
        dctx.fillRect(0,0,28,28);
        const dx = Math.round((28 - targetW) / 2);
        const dy = Math.round((28 - targetH) / 2);
        dctx.drawImage(tmpScaled, 0, 0, targetW, targetH, dx, dy, targetW, targetH);

        return dctx.getImageData(0,0,28,28);
    }
    </script>
