<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <script type="text/javascript">
    // from https://stackoverflow.com/questions/2368784/draw-on-html5-canvas-using-a-mouse
    // https://stackoverflow.com/questions/10673122/how-to-save-canvas-as-an-image-with-canvas-todataurl
    var canvas, ctx, flag = false,
        prevX = 0,
        currX = 0,
        prevY = 0,
        currY = 0,
        dot_flag = false;

    var x = "white",
        y = 16;
    
    function init() {
        canvas = document.getElementById('can');
        ctx = canvas.getContext("2d");
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        w = canvas.width;
        h = canvas.height;
    
        // Unified input: use Pointer Events (works for mouse, touch and pen)
        // Prevent the browser from handling gestures (scroll/zoom) when interacting with the canvas
        canvas.style.touchAction = 'none';

        // Pointer down/move/up handlers call the same findxy() function
        canvas.addEventListener('pointerdown', function (e) {
            if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
            e.preventDefault();
            findxy('down', e);
        }, false);

        canvas.addEventListener('pointermove', function (e) {
            // don't call preventDefault here unless necessary; pointerdown already disabled touch-action
            findxy('move', e);
        }, false);

        canvas.addEventListener('pointerup', function (e) {
            if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
            e.preventDefault();
            findxy('up', e);
        }, false);

        canvas.addEventListener('pointercancel', function (e) {
            if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId);
            findxy('out', e);
        }, false);

        ctx.lineWidth = y;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'white';
    }
    
    function draw() {
        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(currX, currY);
        ctx.strokeStyle = x;
        ctx.lineWidth = y;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.closePath();
    }
    
    function erase() {
        //var m = confirm("Want to clear");
        //ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 4; i++) {
            document.getElementById('label' + i).innerHTML = '';
        }

        document.getElementById('skel').src = "";
        document.getElementById('chull').src = "";
        document.getElementById('endpoint').src = "";
        document.getElementById('corner').src = "";
        document.getElementById('crossing').src = "";
        document.getElementById('line').src = "";
        document.getElementById('circle').src = "";
        document.getElementById('ellipse-circle').src = "";
        document.getElementById('ellipse').src = "";
        document.getElementById('fill').src = "";
        document.getElementById('raw').src = "";


    }

    function characterize_confidence(conf) {
        if (conf >= 0.750) {
            return "high";
        } else if ( conf >= 0.250 ) {
            return "medium"
        } else {
            return "low"
        }
    }
    
    function submit() {
        // Create a temporary canvas for scaling
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 28;
        tempCanvas.height = 28;
        const tempCtx = tempCanvas.getContext('2d');
        
        // Scale down the image with smoothing
        tempCtx.imageSmoothingEnabled = true;
        tempCtx.imageSmoothingQuality = 'high';
        tempCtx.drawImage(canvas, 0, 0, 280, 280, 0, 0, 28, 28);

        let transNameToProp = {
            skel: "stroke",
            chull: "convex hull",
            fill: "enclosed region"
        };

    // scale and center the drawing to 28x28
    const imgData = to28x28Centered(canvas);
        //var dataURL = canvas.toDataURL();
        //console.log('data URL', dataURL);
        //console.log("image data:", imgData);

        //console.log("length", imgData.data.length);
        let img = [];
        for (let i = 0; i < imgData.data.length; i += 4) {
            img.push(imgData.data[i]);
        }
        console.log(img);

        // https://stackoverflow.com/questions/36975619/how-to-call-a-rest-web-service-api-from-javascript
        // https://fastapi.tiangolo.com/ 
        fetch('/submit_pbe', {
            method: 'POST',
            //crossorigin: true,
            //mode: 'no-cors',
            headers: {
                "Content-Type": "application/json",
			    "Accept": "application/json"
            },
            body: JSON.stringify(img)
        })
        .then(data => {
            return data.json()
        })
        .then(d => {
            console.log("json:", d)
            console.log(typeof(d))
            tally = JSON.parse(d)
            // get the total weight
            let total = 0.0
            for (let v of tally) {
                // sort attributions based on effectiveness
                v.attributions.sort((a, b) => {
                    return b.effectiveness - a.effectiveness;
                });
                total += v.value;
                v["exp"] = v.explainability / v.value;
            }
            // sort the votes
            tally.sort((a, b) => {
                return b.value - a.value
            });
            let count = 0
            for (let v of tally) {
                v.pred = v.value / total;
                let res = "<br>The digit " + v. class
                if (count == 0) {
                    res += " won"
                } else {
                    res += " was an alternative"
                }
                res += " with " + characterize_confidence(v.pred) + " confidence, " + v.pred.toPrecision(3) + ", and " + characterize_confidence(v.exp) +  " explainability, " + v.exp.toPrecision(3) + ", due to the "
                let prop_ix = 0;
                for (let a of v.attributions) {
                    if (a.image) {
                        //document.getElementById(a.name).style.border = "2px solid";
                        //var dataURL = canvas.toDataURL();
                        var img = document.getElementById(a.name);
                        console.log("image:", a.name, img);
                        if (img) {  // Only set src if the element exists
                            img.src = 'data:image/png;base64,' + a.image;
                        }
                        //document.getElementById(a.name).style.display = "inline";
                        /*
                        const tmp_canvas = document.createElement('tmp_canvas'); 
                        const tmp_ctx = canvas.getContext('2d'); 
                        tmp_canvas.width = 28; 
                        tmp_canvas.height = 28;
                        var image_data = tmp_ctx.createImageData(28, 28);
                        var data = image_data.data;
                        let count = 0;
                        for (let i = 0; i < data.length; data += 4) {
                            data[i] = data[i+1] = data[i+2] = a.image[count];
                            data[i+3] = 255;
                            count++;
                        }
                        tmp_ctx.putImageData(image_data, 0, 0);
                        var dataURL = canvas.toDataURL();
                        img.src = dataURL;
                        */
                    }
                    if (prop_ix != 0) {
                        res += ", "
                    }
                    res += transNameToProp[a.name] || a.name
                    prop_ix++;
                }
                res += " propert"
                if (prop_ix > 1) {
                    res += "ies"
                } else {
                    res += "y"
                }
                res += "."
                res += v.failures
                res += "\n<br><hr>"
                if (count < 4 && v.value > 0.0) {
                    document.getElementById('label' + count).innerHTML = res;
                }
                count++;
            }
            console.log("tally:", tally)
        })
        .catch(error => {
            console.error("Error:", error);
        });

    }
    
    function findxy(res, e) {
        const pos = getCanvasCoords(e);
        if (res == 'down') {
            prevX = currX;
            prevY = currY;
            currX = pos.x;
            currY = pos.y;
    
            flag = true;
            dot_flag = true;
            if (dot_flag) {
                ctx.beginPath();
                ctx.fillStyle = x;
                ctx.fillRect(currX, currY, 2, 2);
                ctx.closePath();
                dot_flag = false;
            }
        }
        if (res == 'up' || res == "out") {
            flag = false;
        }
        if (res == 'move') {
            if (flag) {
                prevX = currX;
                prevY = currY;
                currX = pos.x;
                currY = pos.y;
                draw();
            }
        }
    }

    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // Crop the non-background bounding box, scale it to fit an inner box (20x20),
    // then center that onto a 28x28 canvas and return ImageData.
    function to28x28Centered(srcCanvas, bgColor = [0,0,0,255]) {
        const sw = srcCanvas.width, sh = srcCanvas.height;
        const sctx = srcCanvas.getContext('2d');
        const sdata = sctx.getImageData(0, 0, sw, sh).data;

        let minX = sw, minY = sh, maxX = 0, maxY = 0, found = false;
        for (let y = 0; y < sh; y++) {
            for (let x = 0; x < sw; x++) {
                const idx = (y * sw + x) * 4;
                const r = sdata[idx], g = sdata[idx+1], b = sdata[idx+2], a = sdata[idx+3];
                if (!(r === bgColor[0] && g === bgColor[1] && b === bgColor[2] && a === bgColor[3])) {
                    found = true;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (!found) {
            const tmp = document.createElement('canvas');
            tmp.width = 28; tmp.height = 28;
            const tctx = tmp.getContext('2d');
            tctx.fillStyle = 'black';
            tctx.fillRect(0,0,28,28);
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = 'high';
            tctx.drawImage(srcCanvas, 0, 0, sw, sh, 0, 0, 28, 28);
            return tctx.getImageData(0,0,28,28);
        }

        const cw = maxX - minX + 1;
        const ch = maxY - minY + 1;
        const inner = 20;
        const scale = Math.min(inner / cw, inner / ch);
        const targetW = Math.max(1, Math.round(cw * scale));
        const targetH = Math.max(1, Math.round(ch * scale));

        const tmpScaled = document.createElement('canvas');
        tmpScaled.width = targetW; tmpScaled.height = targetH;
        const sctx2 = tmpScaled.getContext('2d');
        sctx2.imageSmoothingEnabled = true;
        sctx2.imageSmoothingQuality = 'high';
        sctx2.drawImage(srcCanvas, minX, minY, cw, ch, 0, 0, targetW, targetH);

        const dst = document.createElement('canvas');
        dst.width = 28; dst.height = 28;
        const dctx = dst.getContext('2d');
        dctx.fillStyle = 'black';
        dctx.fillRect(0,0,28,28);
        const dx = Math.round((28 - targetW) / 2);
        const dy = Math.round((28 - targetH) / 2);
        dctx.drawImage(tmpScaled, 0, 0, targetW, targetH, dx, dy, targetW, targetH);

        return dctx.getImageData(0,0,28,28);
    }
    </script>
    <body onload="init()">
        <div>Property-Based Explainability - Draw a digit</div>
        <br>
        <div><canvas id="can" width="280" height="280" style="border: 1px solid #ccc;"></canvas></div>
        <br>
        <div>
            <input type="button" value="submit" id="btn" size="25" onclick="submit()">
            <input type="button" value="clear" id="clr" size="23" onclick="erase()">
        </div>
        <br>
        <div>Transforms:</div>
        <div>
            <table>
                <tr>
                    <td>
                        <img id="skel" width="28" height="28"><figcaption>Skel</figcaption>
                    </td>
                    <td>
                        <img id="chull" width="28" height="28"><figcaption>Chu</figcaption>
                    </td>
                    <td>
                        <img id="endpoint" width="28" height="28"><figcaption>EP</figcaption>
                    </td>
                    <td>
                        <img id="corner" width="28" height="28"><figcaption>Cor</figcaption>
                    </td>
                    <td>
                        <img id="crossing" width="28" height="28"><figcaption>Cro</figcaption>
                    </td>
                    <td>
                        <img id="line" width="28" height="28"><figcaption>Lin</figcaption>
                    </td>
                    <td>
                        <img id="circle" width="28" height="28"><figcaption>Cir</figcaption>
                    </td>
                    <td>
                        <img id="ellipse-circle" width="28" height="28"><figcaption>EC</figcaption>
                    </td>
                    <td>
                        <img id="ellipse" width="28" height="28"><figcaption>El</figcaption>
                    </td>
                    <td>
                        <img id="fill" width="28" height="28"><figcaption>Fill</figcaption>
                    </td>
                    <td>
                        <img id="raw" width="28" height="28"><figcaption>Raw</figcaption>
                    </td>
                </tr>
            </table>
        </div>
        <br>
        <div>Results:</div>
        <div><label id="label0"></label> </div>
        <div><label id="label1"></label> </div>
        <div><label id="label2"></label> </div>
        <div><label id="label3"></label> </div>

        
        <div  style="position: absolute; top: 0; right: 10;">
            <p>
                Copyright &copy; 2025
            </p>
        </div>
        
    </body>
    </html>
