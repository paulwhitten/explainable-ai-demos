# TrueNAS Community Edition -- Apps > Discover Apps > Custom App > Install via YAML
# Serves the explainable-ai demos and publishes them through a Cloudflare tunnel.
# Runtime assets are read (read-only) from the ZFS dataset; the tunnel token comes
# from the dataset's .env (never committed).
services:
  app:
    image: ghcr.io/paulwhitten/explainable-ai-demos:latest
    restart: unless-stopped
    mem_limit: 4g
    expose:
      - "8000"
    volumes:
      - /mnt/pool0/apps/explainable-ai-demos/models:/app/models:ro
      - /mnt/pool0/apps/explainable-ai-demos/kb:/app/kb:ro
      - /mnt/pool0/apps/explainable-ai-demos/out_neighbors:/app/out_neighbors:ro
    # Optional: also reach the app directly on the NAS at http://<nas-ip>:8000
    # ports:
    #   - "8000:8000"

  cloudflared:
    # Pinned (not :latest) so a redeploy is deterministic and auditable.
    # Must be >= 2026.10.2 to drop trust in the compromised eMudhra/emSign
    # intermediate certificates (Cloudflare advisory, 2026-10-20).
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    env_file:
      - /mnt/pool0/apps/explainable-ai-demos/.env
    command: tunnel --no-autoupdate run
    depends_on:
      - app
