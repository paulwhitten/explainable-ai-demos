services:
  app:
    build: .
    image: explainable-ai-demos:latest
    restart: unless-stopped
    mem_limit: 4g
    expose:
      - "8000"
    volumes:
      # Runtime assets from the ZFS dataset (Gitea/LFS-versioned), not baked into the image.
      # ASSETS_DIR points at the dataset mount, e.g. /mnt/pool/apps/svm-xai
      - ${ASSETS_DIR:-./assets}/models:/app/models:ro
      - ${ASSETS_DIR:-./assets}/kb:/app/kb:ro
      - ${ASSETS_DIR:-./assets}/out_neighbors:/app/out_neighbors:ro

  cloudflared:
    # Pinned (not :latest) so a redeploy is deterministic and auditable.
    # Must be >= 2026.10.2 to drop trust in the compromised eMudhra/emSign
    # intermediate certificates (Cloudflare advisory, 2026-10-20).
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    # cloudflared reads TUNNEL_TOKEN from the environment (see sample.env)
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    depends_on:
      - app
