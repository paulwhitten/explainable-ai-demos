services:
  app:
    build: .
    image: explainable-ai-demos:latest
    restart: unless-stopped
    mem_limit: 4g
    # Hold the app to a small share of the NAS. The thread counts match cpus so
    # the math libraries do not start one thread per host core.
    cpus: 2
    pids_limit: 256
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    # Nothing in the image is writable, and only /tmp is writable at runtime.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The app makes no outbound calls, so it gets no route to the internet or LAN.
    networks:
      - internal
    expose:
      - "8000"
    volumes:
      # Runtime assets from the ZFS dataset (Gitea/LFS-versioned), not baked into the image.
      # ASSETS_DIR points at the dataset mount, e.g. /mnt/pool/apps/svm-xai
      - ${ASSETS_DIR:-./assets}/models:/app/models:ro
      - ${ASSETS_DIR:-./assets}/kb:/app/kb:ro
      - ${ASSETS_DIR:-./assets}/out_neighbors:/app/out_neighbors:ro

  cloudflared:
    # Pinned (not :latest) so a redeploy is deterministic and auditable.
    # Must be >= 2026.10.2 to drop trust in the compromised eMudhra/emSign
    # intermediate certificates (Cloudflare advisory, 2026-10-20).
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    # cloudflared reads TUNNEL_TOKEN from the environment (see sample.env)
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # internal reaches the app, and egress reaches Cloudflare.
    networks:
      - internal
      - egress
    depends_on:
      - app

networks:
  internal:
    internal: true
    # Without this, containers can still reach services on the host itself,
    # such as the TrueNAS UI and Gitea, through the bridge address.
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  egress: {}
